name: Update fee tables

on:
  schedule:
    - cron: "17 5 * * *" # every day, 08:17 in Madagascar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fee-tables
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests (offline fixtures)
        run: python -m pytest -q

      - name: Scrape official websites
        id: build
        continue-on-error: true
        run: python -m feezer_tables.build

      - name: Validate fees.json
        run: python -m feezer_tables.build --check

      - name: Publish
        run: |
          if git diff --quiet -- fees.json; then
            echo "Nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fees.json
          git commit -m "Fee tables checked on $(date -u +%Y-%m-%d)"
          git push

      - name: Report scraping failures
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::A source could not be scraped; its previous grids were kept. See the 'Scrape official websites' step."
          exit 1
